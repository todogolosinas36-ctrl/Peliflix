<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#141414">
  <meta name="color-scheme" content="dark">

  <title>Configuración | Peloflix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23E50914'/><text x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='bold' fill='%23fff' text-anchor='middle'>P</text></svg>">

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Iconografía -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Sistema de diseño -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="config-page">

  <!-- ==========================================================================
       HEADER (NAVBAR)
       ========================================================================== -->
  <header id="main-header" class="header">
    <div class="header-container">

      <a href="index.html" class="brand-logo" id="brand-logo" tabindex="0" aria-label="Peloflix, ir al inicio">
        <span class="logo-text">Peloflix</span>
      </a>

      <div class="header-right">
        <a href="config.html" id="header-settings-btn" class="header-settings-btn" tabindex="0" aria-label="Configuración" title="Ajustes">
          <i class="fa-solid fa-gear" aria-hidden="true"></i>
        </a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="settings-container">
      <h1 class="settings-title">Configuración</h1>
      
      <div class="settings-card premium-card">
        <h2 class="card-title">Conexión de Catálogo (API)</h2>
        <p class="card-desc">Ingresa tu API Key de TMDB para cargar las películas y series.</p>
        
        <div class="input-group">
          <input type="password" id="tmdb-api-input" class="premium-input" placeholder="Ingresa tu API Key de TMDB" tabindex="0">
        </div>
        
        <div class="actions-group">
          <button id="save-api-btn" class="btn btn-primary premium-btn" tabindex="0">
            Guardar Cambios
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Notificación Toast -->
  <div id="toast-notification" class="toast-premium hidden" role="alert">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toast-message">API Key guardada con éxito</span>
  </div>

  <script src="config.js" defer></script>
</body>
</html>
